# H01-2 (RF01) — bloco III, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- tapOn:
    point: "6%,97%"   # plus
- tapOn: "Áudio"
- tapOn: "Toque para gravar"
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 3000
    optional: true
- tapOn:
    point: "93%,8%"   # fechar_modal
- runFlow: _comum/registros.yaml
