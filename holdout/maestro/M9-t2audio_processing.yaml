# estado M9 `t2audio_processing` (estados-m9.md, conta A)
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "t2audio_processing"}
- tapOn:
    point: "6%,97%"   # plus
- tapOn: "Áudio"
- tapOn: "Toque para gravar"
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 3000
    optional: true
- tapOn:
    text: "Toque para gravar"
    optional: true
- assertVisible: "Transcrevendo..."
- takeScreenshot: ${CICLO_ANON}-t2audio_processing
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: disarm}
