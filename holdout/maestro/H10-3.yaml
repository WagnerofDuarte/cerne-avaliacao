# H10-3 (RF10) — bloco III, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o dia no trabalho"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "H10-3"}
- tapOn:
    point: "94%,88%"   # marcador
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 3000
    optional: true
- takeScreenshot: ${CICLO_ANON}-H10-3-erro
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o sono"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o dia no trabalho"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: disarm}
- tapOn:
    point: "94%,88%"   # marcador
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 5000
    optional: true
- takeScreenshot: ${CICLO_ANON}-H10-3-salvo
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=contagem&fn=entries-create&min=2"}
- assertTrue: ${output.ok}
