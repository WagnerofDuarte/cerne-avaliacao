- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "H09-3a"}
- tapOn:
    point: "7%,8%"   # menu
- tapOn: "Configurações"
- assertVisible: "Sua evolução"
- takeScreenshot: ${CICLO_ANON}-H09-3-texto-longo
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "H09-3b"}
- tapOn:
    point: "7%,8%"   # menu
- tapOn: "Meus Registros"
- tapOn:
    point: "7%,8%"   # menu
- tapOn: "Configurações"
- assertVisible: "Sua evolução"
- takeScreenshot: ${CICLO_ANON}-H09-3-texto-vazio
