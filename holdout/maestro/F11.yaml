# F11 — export-summary-create / malformed (rnf09.md)
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "F11"}
- runFlow: _comum/registros.yaml
- tapOn:
    point: "93%,8%"   # download
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 3000
    optional: true
- assertVisible: "Tentar novamente"
- takeScreenshot: ${CICLO_ANON}-F11-erro
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: disarm}
# recuperacao: repetir a mesma acao SEM reiniciar o app; condicao 4 do criterio 'tratado'
- tapOn:
    text: "Tentar novamente"
    optional: true
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 3000
    optional: true
- takeScreenshot: ${CICLO_ANON}-F11-recuperado
