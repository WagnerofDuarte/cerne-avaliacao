# H04-1 (RF04) — bloco I, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o dia no trabalho"}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Obrigado por ouvir, isso me ajudou a organizar melhor o que eu tava sentindo sobre essa semana."}
# (a) streaming: capturas sucessivas; texto cresce
- takeScreenshot: ${CICLO_ANON}-H04-1-streaming
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 10000
    optional: true
- takeScreenshot: ${CICLO_ANON}-H04-1-completa
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Mais uma mensagem para provocar a falha"}
- assertVisible: "Falha ao gerar resposta — toque para tentar novamente"
