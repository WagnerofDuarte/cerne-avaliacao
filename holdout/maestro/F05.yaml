# F05 — chat-messages-send / malformed (rnf09.md)
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "F05"}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "mensagem de teste das falhas"}
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 3000
    optional: true
- assertVisible: "Não foi possível enviar — toque para tentar novamente"
- takeScreenshot: ${CICLO_ANON}-F05-erro
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: disarm}
# recuperacao: repetir a mesma acao SEM reiniciar o app; condicao 4 do criterio 'tratado'
- tapOn:
    text: "Tentar novamente"
    optional: true
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 3000
    optional: true
- takeScreenshot: ${CICLO_ANON}-F05-recuperado
