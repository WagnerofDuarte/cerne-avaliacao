# estado M9 `t2audio_error` (estados-m9.md, conta A)
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- tapOn:
    point: "6%,97%"   # plus
- tapOn: "Áudio"
- tapOn: "Toque para gravar"
# 2 s de silencio
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 2000
    optional: true
- tapOn:
    text: "Toque para gravar"
    optional: true
- assertVisible: "Não foi possível transcrever"
- takeScreenshot: ${CICLO_ANON}-t2audio_error
