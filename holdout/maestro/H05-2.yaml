# H05-2 (RF05) — bloco I, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runFlow: _comum/registros.yaml
- tapOn:
    point: "93%,8%"   # download
# pedir a exportacao
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 10000
    optional: true
- assertVisible: "Baixar dados brutos"
- tapOn: "Baixar dados brutos"
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=contagem&fn=export-download-get&igual=1"}
- assertTrue: ${output.ok}
