# estado M9 `exp_pending` (estados-m9.md, conta A)
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "exp_pending"}
- runFlow: _comum/registros.yaml
- tapOn:
    point: "93%,8%"   # download
- assertVisible: "Preparando exportação..."
- takeScreenshot: ${CICLO_ANON}-exp_pending
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: disarm}
