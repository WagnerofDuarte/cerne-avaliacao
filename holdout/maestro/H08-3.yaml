# H08-3 (RF08) — bloco I, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o dia no trabalho"}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Mensagem que dispara novo gatilho"}
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 10000
    optional: true
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Outra mensagem depois da falha do insight"}
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 10000
    optional: true
- assertNotVisible: "Falha ao gerar resposta — toque para tentar novamente"
