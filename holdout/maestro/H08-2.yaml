# H08-2 (RF08) — bloco I, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o sono"}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Vou tentar deixar o celular fora do quarto essa semana e ver se isso muda alguma coisa no meu sono."}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Acho que vou começar carregando o celular na sala, assim fico sem desculpa pra ficar mexendo já na cama."}
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 130000
    optional: true
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=contagem&fn=chat-insight-create&igual=1"}
- assertTrue: ${output.ok}
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 120000
    optional: true
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=contagem&fn=chat-insight-create&igual=1"}
- assertTrue: ${output.ok}
