# H03-2 (RF03) — bloco III, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- assertVisible: "Escreva uma mensagem..."
- pressKey: Home      # iOS: enviar ao background
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 310000
    optional: true
- launchApp
- assertVisible: "Toque para desbloquear"
- assertNotVisible: "Escreva uma mensagem..."
