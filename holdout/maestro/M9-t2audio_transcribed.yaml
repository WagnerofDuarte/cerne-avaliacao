    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- tapOn:
    point: "6%,97%"   # plus
- tapOn: "Áudio"
- tapOn: "Toque para gravar"
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 8000
    optional: true
- tapOn:
    text: "Toque para gravar"
    optional: true
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 15000
    optional: true
- takeScreenshot: ${CICLO_ANON}-t2audio_transcribed
