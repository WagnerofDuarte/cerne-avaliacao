# H04-2 (RF04) — bloco I, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o dia no trabalho"}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Mensagem seguinte do roteiro"}
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 5000
    optional: true
# o proxy encerra o SSE apos o 3o token
- assertVisible: "Falha ao gerar resposta — toque para tentar novamente"
- tapOn: "Falha ao gerar resposta — toque para tentar novamente"
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=contagem&fn=chat-messages-retry&igual=1"}
- assertTrue: ${output.ok}
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=contagem&fn=chat-messages-send&igual=1"}
- assertTrue: ${output.ok}
