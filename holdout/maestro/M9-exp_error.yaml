# estado M9 `exp_error` (estados-m9.md, conta A)
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "exp_error"}
- runFlow: _comum/registros.yaml
- tapOn:
    point: "93%,8%"   # download
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 10000
    optional: true
- assertVisible: "Baixar dados brutos"
- takeScreenshot: ${CICLO_ANON}-exp_error
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: disarm}
