# F15 — chat-insight-create / offline (rnf09.md)
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o sono"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "F15"}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Conversei com minha irmã por telefone e combinamos de nos ver no domingo."}
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 130000
    optional: true
# condicao 2 nao se aplica: NENHUM erro visivel
- assertNotVisible: "Não foi possível"
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=fault_injetado&fn=chat-insight-create"}
- assertTrue: ${output.ok}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: disarm}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "mensagem depois da falha"}
- takeScreenshot: ${CICLO_ANON}-F15-chat-segue
