# H08-1 (RF08) — bloco I, conta A
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o dia no trabalho"}
- runFlow:
    file: _comum/enviar.yaml
    env: {TEXTO: "Obrigado por ouvir, isso me ajudou a organizar melhor o que eu tava sentindo sobre essa semana."}
- extendedWaitUntil:
    visible: "__espera_tempo_real__"
    timeout: 10000
    optional: true
- assertVisible: "INSIGHT"
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=contagem&fn=chat-insight-create&igual=1"}
- assertTrue: ${output.ok}
# reabrir a sessao nao gera nova chamada
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o sono"}
- runFlow:
    file: _comum/conversa.yaml
    env: {CONVERSA: "Conversa sobre o dia no trabalho"}
- runScript:
    file: ../scripts/checar.js
    env: {QUERY: "regra=contagem&fn=chat-insight-create&igual=1"}
- assertTrue: ${output.ok}
