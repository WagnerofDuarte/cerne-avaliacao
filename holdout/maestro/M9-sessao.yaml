# estado M9 `sessao` (estados-m9.md, conta A)
appId: ${APP_ID}
---
- runFlow:
    file: _comum/entrar.yaml
    env: {EMAIL: "cenario-cheio@cerne.test", SENHA: "${SENHA_A}"}
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: arm, CENARIO: "sessao"}
- tapOn:
    point: "7%,8%"   # menu
- assertVisible: "Sessão expirada"
- takeScreenshot: ${CICLO_ANON}-sessao
- runScript:
    file: ../scripts/proxy.js
    env: {ACAO: disarm}
